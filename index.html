<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pub Tour — Virtual Visit</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  :root{
    --wood: #2a1a12;
    --wood-light: #4a2f1e;
    --brass: #c9a86a;
    --brass-bright: #e8c98a;
    --cream: #f2e9d8;
    --shadow: rgba(0,0,0,0.55);
  }
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }

  a-scene { width:100%; height:100%; }

  /* ---- Loading screen ---- */
  #loading {
    position:fixed; inset:0; background:var(--wood); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--cream); transition: opacity 0.6s ease;
  }
  #loading h1 { font-size:1.6rem; letter-spacing:0.08em; margin:0 0 0.6rem; color:var(--brass-bright); font-weight:normal;}
  #loading p { font-size:0.85rem; color:var(--brass); letter-spacing:0.05em; }
  .spinner {
    width:34px; height:34px; margin-bottom:1.2rem;
    border:3px solid rgba(232,201,138,0.25); border-top-color: var(--brass-bright);
    border-radius:50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg);} }

  /* ---- Title / scene label ---- */
  #scene-label {
    position:fixed; left:20px; bottom:20px; z-index:20;
    background: linear-gradient(135deg, var(--shadow), transparent 130%);
    padding:14px 18px 12px 16px; border-left:3px solid var(--brass-bright);
    pointer-events:none; max-width:70vw;
  }
  #scene-label .pub-name { display:block; font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--brass); margin-bottom:2px; }
  #scene-label .room-name { display:block; font-size:1.3rem; color:var(--cream); }

  /* ---- Menu toggle ---- */
  #menu-toggle {
    position:fixed; top:16px; right:16px; z-index:30;
    width:46px; height:46px; border-radius:50%;
    background: var(--shadow); border:1px solid rgba(232,201,138,0.4);
    color:var(--brass-bright); font-size:1.3rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- Nav menu ---- */
  #nav-panel {
    position:fixed; top:0; right:0; height:100%; width:280px; max-width:80vw; z-index:29;
    background: linear-gradient(180deg, #1c110a 0%, #241609 100%);
    border-left:1px solid rgba(232,201,138,0.25);
    transform: translateX(100%); transition: transform 0.35s ease;
    padding:70px 0 20px; box-sizing:border-box; overflow-y:auto;
  }
  #nav-panel.open { transform: translateX(0); }
  .nav-group-title {
    color:var(--brass-bright); font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase;
    padding:10px 22px 6px; border-top:1px solid rgba(232,201,138,0.15); margin-top:8px;
  }
  .nav-group-title:first-of-type{ border-top:none; margin-top:0; }
  .nav-item {
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--cream); font-family:inherit; font-size:0.95rem; padding:9px 22px;
    cursor:pointer; opacity:0.75;
  }
  .nav-item:hover { opacity:1; background:rgba(232,201,138,0.08); }
  .nav-item.active { opacity:1; color:var(--brass-bright); }

  /* ---- Hint ---- */
  #hint {
    position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:20;
    color: var(--cream); background:var(--shadow); padding:8px 16px; border-radius:20px;
    font-size:0.8rem; letter-spacing:0.03em; opacity:0.9; pointer-events:none;
    transition: opacity 1s ease;
  }

  /* Restyle A-Frame's default VR button */
  .a-enter-vr { bottom:20px !important; right:20px !important; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h1>THE STILEBRIDGE</h1>
  <p>Loading the tour&hellip;</p>
</div>

<div id="hint">Drag to look around &middot; tap a glowing marker to move</div>

<div id="scene-label">
  <span class="pub-name" id="pub-name-label">The Stilebridge</span>
  <span class="room-name" id="room-name-label">Main Bar</span>
</div>

<div id="menu-toggle">&#9776;</div>
<div id="nav-panel"></div>

<a-scene loading-screen="enabled: false" vr-mode-ui="enabled: true">

  <a-assets id="asset-root"></a-assets>

  <a-sky id="sky" rotation="0 -90 0"></a-sky>

  <a-entity id="hotspot-root"></a-entity>

  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="cam" look-controls="reverseMouseDrag:false" wasd-controls-enabled="false">
      <a-entity cursor="fuse: true; fuseTimeout: 900"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner:0.006; radiusOuter:0.01"
                material="color:#e8c98a; shader:flat; opacity:0.9"
                animation__fuse="property: scale; startEvents: fusing; easing: easeInCubic; dur: 900; from: 1 1 1; to: 3 3 3">
      </a-entity>
    </a-camera>
  </a-entity>

</a-scene>

<script>
/* =====================================================================
   TOUR DATA
   Each scene: id, pub, title, image file, and hotspots that link to
   other scene ids. Hotspot position is given as yaw degrees (0-360,
   compass-style around the panorama) and an optional pitch in degrees.
   These are placed at sensible default angles — easy to nudge later
   by changing the "yaw" numbers once you've viewed the tour.
   ===================================================================== */
const TOUR_DATA = {
  scenes: {
    main_bar: {
      pub: "The Stilebridge",
      title: "Main Bar",
      image: "images/Main_Bar.jpg",
      hotspots: [
        { to: "front_bar", label: "Front Bar", yaw: 100 },
        { to: "panelled_bar", label: "Panelled Bar", yaw: 260 }
      ]
    },
    front_bar: {
      pub: "The Stilebridge",
      title: "Front Bar",
      image: "images/Front_Bar.jpg",
      hotspots: [
        { to: "main_bar", label: "Main Bar", yaw: 300 },
        { to: "back_bar", label: "Back Bar", yaw: 120 }
      ]
    },
    back_bar: {
      pub: "The Stilebridge",
      title: "Back Bar",
      image: "images/Back_Bar.jpg",
      hotspots: [
        { to: "front_bar", label: "Front Bar", yaw: 300 },
        { to: "restaurant", label: "Restaurant", yaw: 90 }
      ]
    },
    restaurant: {
      pub: "The Stilebridge",
      title: "Restaurant",
      image: "images/Restaurant.jpg",
      hotspots: [
        { to: "back_bar", label: "Back Bar", yaw: 270 }
      ]
    },
    panelled_bar: {
      pub: "The Stilebridge",
      title: "Panelled Bar",
      image: "images/Panelled_Bar.jpg",
      hotspots: [
        { to: "main_bar", label: "Main Bar", yaw: 80 }
      ]
    }
  },
  // Order pubs and their scene ids appear in the nav menu
  pubOrder: ["The Stilebridge"],
  pubScenes: {
    "The Stilebridge": ["main_bar", "front_bar", "back_bar", "restaurant", "panelled_bar"]
  },
  startScene: "main_bar"
};

/* ===================== engine (no need to edit below) ================= */

const assetRoot = document.getElementById('asset-root');
const sky = document.getElementById('sky');
const hotspotRoot = document.getElementById('hotspot-root');
const pubLabel = document.getElementById('pub-name-label');
const roomLabel = document.getElementById('room-name-label');
const navPanel = document.getElementById('nav-panel');
const menuToggle = document.getElementById('menu-toggle');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');

let currentId = null;
const imgElsById = {};

function preloadAll() {
  const ids = Object.keys(TOUR_DATA.scenes);
  ids.forEach(id => {
    const scene = TOUR_DATA.scenes[id];
    const img = document.createElement('img');
    img.setAttribute('id', 'img-' + id);
    img.setAttribute('src', scene.image);
    img.setAttribute('crossorigin', 'anonymous');
    assetRoot.appendChild(img);
    imgElsById[id] = img;
  });
}

function yawPitchToPosition(yawDeg, pitchDeg, radius) {
  const yaw = THREE.MathUtils.degToRad(yawDeg);
  const pitch = THREE.MathUtils.degToRad(pitchDeg || 0);
  const x = radius * Math.sin(yaw) * Math.cos(pitch);
  const z = -radius * Math.cos(yaw) * Math.cos(pitch);
  const y = radius * Math.sin(pitch);
  return `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`;
}

function buildNavPanel() {
  navPanel.innerHTML = '';
  TOUR_DATA.pubOrder.forEach(pub => {
    const title = document.createElement('div');
    title.className = 'nav-group-title';
    title.textContent = pub;
    navPanel.appendChild(title);
    TOUR_DATA.pubScenes[pub].forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.id = id;
      btn.textContent = TOUR_DATA.scenes[id].title;
      btn.addEventListener('click', () => { goTo(id); navPanel.classList.remove('open'); });
      navPanel.appendChild(btn);
    });
  });
}

function refreshNavActive() {
  navPanel.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === currentId);
  });
}

function buildHotspots(id) {
  hotspotRoot.innerHTML = '';
  const scene = TOUR_DATA.scenes[id];
  scene.hotspots.forEach(h => {
    const pos = yawPitchToPosition(h.yaw, h.pitch, 4.2);
    const wrapper = document.createElement('a-entity');
    wrapper.setAttribute('position', pos);
    wrapper.setAttribute('look-at', '#cam');

    const ring = document.createElement('a-entity');
    ring.setAttribute('geometry', 'primitive: ring; radiusInner: 0.28; radiusOuter: 0.4');
    ring.setAttribute('material', 'color:#e8c98a; shader:flat; opacity:0.9; side:double');
    ring.setAttribute('class', 'clickable');
    ring.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 1100; loop: true; to: 1.15 1.15 1.15');
    ring.addEventListener('click', () => goTo(h.to));

    const dot = document.createElement('a-entity');
    dot.setAttribute('geometry', 'primitive: circle; radius: 0.14');
    dot.setAttribute('material', 'color:#f2e9d8; shader:flat; opacity:0.95');

    const text = document.createElement('a-entity');
    text.setAttribute('text', `value:${h.label}; align:center; color:#f2e9d8; width:3; baseline:top`);
    text.setAttribute('position', '0 -0.62 0');

    wrapper.appendChild(ring);
    wrapper.appendChild(dot);
    wrapper.appendChild(text);
    hotspotRoot.appendChild(wrapper);
  });
}

function goTo(id) {
  const scene = TOUR_DATA.scenes[id];
  if (!scene) return;
  currentId = id;
  sky.setAttribute('src', '#img-' + id);
  pubLabel.textContent = scene.pub;
  roomLabel.textContent = scene.title;
  buildHotspots(id);
  refreshNavActive();
}

preloadAll();
buildNavPanel();

menuToggle.addEventListener('click', () => navPanel.classList.toggle('open'));

const sceneEl = document.querySelector('a-scene');
sceneEl.addEventListener('loaded', () => {
  goTo(TOUR_DATA.startScene);
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 650);
  setTimeout(() => { hint.style.opacity = '0'; }, 4500);
});
</script>

</body>
</html>
