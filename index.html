<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pub Tour — Virtual Visit</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  :root{
    --wood: #2a1a12;
    --wood-light: #4a2f1e;
    --brass: #c9a86a;
    --brass-bright: #e8c98a;
    --cream: #f2e9d8;
    --shadow: rgba(0,0,0,0.55);
  }
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
    font-family: Georgia, 'Times New Roman', serif; }

  a-scene { width:100%; height:100%; }

  /* ---- Loading screen ---- */
  #loading {
    position:fixed; inset:0; background:var(--wood); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--cream); transition: opacity 0.6s ease; text-align:center; padding:0 24px; box-sizing:border-box;
  }
  #loading h1 { font-size:1.6rem; letter-spacing:0.08em; margin:0 0 0.6rem; color:var(--brass-bright); font-weight:normal;}
  #loading p { font-size:0.85rem; color:var(--brass); letter-spacing:0.05em; margin:0; }
  #loading .tip { margin-top:1.4rem; font-size:0.78rem; color:var(--cream); opacity:0.85; max-width:280px; line-height:1.5; }
  #loading .tip .icon { display:inline-block; border:1px solid rgba(232,201,138,0.5); border-radius:6px;
    padding:1px 7px; margin:0 2px; font-size:0.9rem; vertical-align:-2px; }
  .spinner {
    width:34px; height:34px; margin-bottom:1.2rem;
    border:3px solid rgba(232,201,138,0.25); border-top-color: var(--brass-bright);
    border-radius:50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg);} }

  /* ---- Title / scene label ---- */
  #scene-label {
    position:fixed; left:20px; bottom:20px; z-index:20;
    background: linear-gradient(135deg, var(--shadow), transparent 130%);
    padding:14px 18px 12px 16px; border-left:3px solid var(--brass-bright);
    pointer-events:none; max-width:60vw;
  }
  #scene-label .pub-name { display:block; font-size:0.68rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--brass); margin-bottom:2px; }
  #scene-label .room-name { display:block; font-size:1.3rem; color:var(--cream); }

  /* ---- Menu toggle ---- */
  #menu-toggle {
    position:fixed; top:16px; right:16px; z-index:30;
    width:46px; height:46px; border-radius:50%;
    background: var(--shadow); border:1px solid rgba(232,201,138,0.4);
    color:var(--brass-bright); font-size:1.3rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- Nav menu ---- */
  #nav-panel {
    position:fixed; top:0; right:0; height:100%; width:230px; max-width:78vw; z-index:29;
    background: linear-gradient(180deg, #1c110a 0%, #241609 100%);
    border-left:1px solid rgba(232,201,138,0.25);
    transform: translateX(100%); transition: transform 0.35s ease;
    padding:70px 0 20px; box-sizing:border-box; overflow-y:auto;
  }
  #nav-panel.open { transform: translateX(0); }
  .nav-group-title {
    color:var(--brass-bright); font-size:0.72rem; letter-spacing:0.15em; text-transform:uppercase;
    padding:10px 22px 8px; border-top:1px solid rgba(232,201,138,0.15); margin-top:6px;
  }
  .nav-group-title:first-of-type{ border-top:none; margin-top:0; }
  .nav-item {
    display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--cream); font-family:inherit; font-size:0.95rem; padding:9px 22px;
    cursor:pointer; opacity:0.75;
  }
  .nav-item:hover { opacity:1; background:rgba(232,201,138,0.08); }
  .nav-item.active { opacity:1; color:var(--brass-bright); }
  .nav-item.active::before { content:"● "; font-size:0.6rem; vertical-align:middle; }

  /* ---- Hint ---- */
  #hint {
    position:fixed; top:16px; left:16px; z-index:20;
    color: var(--cream); background:var(--shadow); padding:8px 16px; border-radius:20px;
    font-size:0.8rem; letter-spacing:0.03em; opacity:0.9; pointer-events:none;
    transition: opacity 1s ease;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h1>THE STILEBRIDGE</h1>
  <p>Loading the tour&hellip;</p>
  <div class="tip">Tap the <span class="icon">&#9776;</span> icon in the top-right corner any time to visit the other rooms.</div>
</div>

<div id="hint">Drag to look around &middot; scroll or pinch to zoom</div>

<div id="scene-label">
  <span class="pub-name" id="pub-name-label">The Stilebridge</span>
  <span class="room-name" id="room-name-label">Main Bar</span>
</div>

<div id="menu-toggle">&#9776;</div>
<div id="nav-panel"></div>

<a-scene loading-screen="enabled: false" vr-mode-ui="enabled: false">

  <a-assets id="asset-root"></a-assets>

  <a-sky id="sky" rotation="0 -90 0"></a-sky>

  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="cam" camera="fov: 80" look-controls="reverseMouseDrag:false; magicWindowTrackingEnabled:false" wasd-controls-enabled="false"></a-camera>
  </a-entity>

</a-scene>

<script>
/* =====================================================================
   TOUR DATA
   ===================================================================== */
const TOUR_DATA = {
  scenes: {
    main_bar:     { pub: "The Stilebridge", title: "Main Bar",     image: "images/Main_Bar.jpg" },
    front_bar:    { pub: "The Stilebridge", title: "Front Bar",    image: "images/Front_Bar.jpg" },
    back_bar:     { pub: "The Stilebridge", title: "Back Bar",     image: "images/Back_Bar.jpg" },
    restaurant:   { pub: "The Stilebridge", title: "Restaurant",   image: "images/Restaurant.jpg" },
    panelled_bar: { pub: "The Stilebridge", title: "Panelled Bar", image: "images/Panelled_Bar.jpg" }
  },
  pubOrder: ["The Stilebridge"],
  pubScenes: {
    "The Stilebridge": ["main_bar", "front_bar", "back_bar", "restaurant", "panelled_bar"]
  },
  startScene: "main_bar"
};

/* ===================== engine ================= */

const assetRoot = document.getElementById('asset-root');
const sky = document.getElementById('sky');
const pubLabel = document.getElementById('pub-name-label');
const roomLabel = document.getElementById('room-name-label');
const navPanel = document.getElementById('nav-panel');
const menuToggle = document.getElementById('menu-toggle');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');

let currentId = null;

function preloadAll() {
  Object.keys(TOUR_DATA.scenes).forEach(id => {
    const scene = TOUR_DATA.scenes[id];
    const img = document.createElement('img');
    img.setAttribute('id', 'img-' + id);
    img.setAttribute('src', scene.image);
    img.setAttribute('crossorigin', 'anonymous');
    assetRoot.appendChild(img);
  });
}

function buildNavPanel() {
  navPanel.innerHTML = '';
  TOUR_DATA.pubOrder.forEach(pub => {
    const title = document.createElement('div');
    title.className = 'nav-group-title';
    title.textContent = pub;
    navPanel.appendChild(title);
    TOUR_DATA.pubScenes[pub].forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'nav-item';
      btn.dataset.id = id;
      btn.textContent = TOUR_DATA.scenes[id].title;
      btn.addEventListener('click', () => { goTo(id); navPanel.classList.remove('open'); });
      navPanel.appendChild(btn);
    });
  });
}

function refreshNavActive() {
  navPanel.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === currentId);
  });
}

function goTo(id) {
  const scene = TOUR_DATA.scenes[id];
  if (!scene) return;
  currentId = id;
  sky.setAttribute('src', '#img-' + id);
  pubLabel.textContent = scene.pub;
  roomLabel.textContent = scene.title;
  refreshNavActive();
}

preloadAll();
buildNavPanel();

menuToggle.addEventListener('click', () => navPanel.classList.toggle('open'));

const sceneEl = document.querySelector('a-scene');
sceneEl.addEventListener('loaded', () => {
  goTo(TOUR_DATA.startScene);
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 650);
  setTimeout(() => { hint.style.opacity = '0'; }, 4500);
});

/* ---------------- Zoom: scroll wheel + pinch ---------------- */
const camEl = document.getElementById('cam');
let fov = 80;
const FOV_MIN = 28, FOV_MAX = 100;

function setFov(v) {
  fov = Math.min(FOV_MAX, Math.max(FOV_MIN, v));
  camEl.setAttribute('camera', 'fov', fov);
}

window.addEventListener('wheel', (e) => {
  e.preventDefault();
  setFov(fov + e.deltaY * 0.05);
}, { passive: false });

let pinchStartDist = null;
let pinchStartFov = fov;
window.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
    pinchStartFov = fov;
  }
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStartDist) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const ratio = pinchStartDist / dist;
    setFov(pinchStartFov * ratio);
  }
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStartDist = null;
});
</script>

</body>
</html>
